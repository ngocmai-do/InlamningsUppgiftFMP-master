name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: maimai123
          MYSQL_DATABASE: pensionat
          MYSQL_USER: backend1
          MYSQL_PASSWORD: 12345
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pmaimai123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/pensionat
          SPRING_DATASOURCE_USERNAME: backend1
          SPRING_DATASOURCE_PASSWORD: 12345